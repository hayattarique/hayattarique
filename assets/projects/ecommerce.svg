<g class="in" style="animation-delay:0.86s"><text x="28" y="326" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#a78bfa">▸</text><text x="46" y="326" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#ece9ff">Per-service Jenkins pipelines gated on health</text></g>
<g class="in" style="animation-delay:0.98s"><text x="28" y="352" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#a78bfa">▸</text><text x="46" y="352" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#ece9ff">LLM assistant service built on LangChain4j</text></g>
