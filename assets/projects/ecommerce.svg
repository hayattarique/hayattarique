<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" role="img" aria-label="E-Commerce Microservices: Distributed e-commerce backend, built sprint by sprint: eight modules behind a gateway, a database per service. Reusable JWT security starter (auto-configuration); Refresh-token rotation, revocation and RBAC; OpenTelemetry tracing exported to Jaeger; Per-service Jenkins pipelines gated on health; LLM assistant service built on LangChain4j.">
<title>E-Commerce Microservices: Distributed e-commerce backend, built sprint by sprint: eight modules behind a gateway, a database per service. Reusable JWT security starter (auto-configuration); Refresh-token rotation, revocation and RBAC; OpenTelemetry tracing exported to Jaeger; Per-service Jenkins pipelines gated on health; LLM assistant service built on LangChain4j.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07021a"/><stop offset=".55" stop-color="#140640"/><stop offset="1" stop-color="#07021a"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6d28d9"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#6d28d9"/>
  </linearGradient>
  <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c026d3"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c4b5fd"/><stop offset=".45" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".55" stop-color="#c4b5fd"/><stop offset="1" stop-color="#c4b5fd"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4.5s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<style>
  .in   { animation: in .9s cubic-bezier(.16,1,.3,1) both; }
  .up   { animation: up .8s cubic-bezier(.16,1,.3,1) both; }
  .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.6s ease-out infinite; }
  .pulse{ animation: pulse 2s ease-in-out infinite; }
  .comet{ stroke-dasharray: 90 910; animation: comet 7s linear infinite; }
  .blink{ animation: blink 1s step-end infinite; }
  .nudge{ animation: nudge 1.6s ease-in-out infinite; }
  @keyframes in    { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  @keyframes up    { from { opacity: 0; transform: translateY(14px); }  to { opacity: 1; transform: none; } }
  @keyframes ring  { from { transform: scale(1); opacity: .7; } to { transform: scale(1.7); opacity: 0; } }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes comet { to { stroke-dashoffset: -1000; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

</style>
<path d="M19,1 H501 A18,18 0 0 1 519,19 V421 A18,18 0 0 1 501,439 H19 A18,18 0 0 1 1,421 V19 A18,18 0 0 1 19,1 Z" fill="url(#bg)" stroke="#7c3aed" stroke-opacity=".35"/>
<path class="comet" d="M19,1 H501 A18,18 0 0 1 519,19 V421 A18,18 0 0 1 501,439 H19 A18,18 0 0 1 1,421 V19 A18,18 0 0 1 19,1 Z" pathLength="1000" fill="none" stroke="url(#edge)" stroke-width="2.2" stroke-linecap="round"/>
