<g class="up" style="animation-delay:0.41s"><rect x="249" y="130" width="95" height="26" rx="8" fill="#ffffff" fill-opacity=".06" stroke="#a78bfa" stroke-opacity=".35"/><text x="296" y="147.5" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e9d5ff" text-anchor="middle">PostgreSQL</text></g>
