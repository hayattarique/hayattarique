<text x="28" y="190" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#cfcbea">Distributed e-commerce backend, built sprint by sprint:</text>
<text x="28" y="212" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#cfcbea">eight modules behind a gateway, a database per service.</text>
