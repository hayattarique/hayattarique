<rect x="92" y="40" width="120" height="26" rx="13" fill="#7c3aed" fill-opacity=".22" stroke="#a78bfa" stroke-opacity=".55"/><circle class="pulse" cx="107" cy="53" r="4" fill="#22c55e"/><text x="119" y="58" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#ddd6fe">FLAGSHIP</text>
