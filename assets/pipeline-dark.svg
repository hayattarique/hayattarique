<svg xmlns="http://www.w3.org/2000/svg" width="880" height="164" viewBox="0 0 880 164" role="img" aria-label="Delivery pipeline, one Jenkins pipeline per service: install parent POM, install the shared starter, test, package, stop the old instance with SIGTERM, deploy the jar, then a health gate on /actuator/health that fails the build unless the new instance reports UP.">
<title>Delivery pipeline, one Jenkins pipeline per service: install parent POM, install the shared starter, test, package, stop the old instance with SIGTERM, deploy the jar, then a health gate on /actuator/health that fails the build unless the new instance reports UP.</title>
<style>
  .pkt { opacity: 0; }
  @supports (offset-path: path('M0,0 L1,1')) {
    .pkt { animation: travel 2.6s cubic-bezier(.45,0,.55,1) infinite both; }
  }
  @keyframes travel { 0% { offset-distance: 0%; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pkt { animation: none !important; opacity: 0; } }
  .run { transform-box: fill-box; transform-origin: left center; animation: run 6s cubic-bezier(.4,0,.2,1) infinite; }
  @keyframes run { 0% { transform: scaleX(0); opacity: 1; } 80% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .run { animation: none !important; } }</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6e7681"/></marker></defs>
<rect x=".5" y=".5" width="879" height="163" rx="10" fill="#0d1117" stroke="#30363d"/>
