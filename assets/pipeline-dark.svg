<text x="856" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" text-anchor="end" fill="#8d96a0">fails the build unless the new instance reports UP</text>
<rect x="24.0" y="46" width="108" height="74" rx="6" fill="#161b22" stroke="#30363d"/><circle cx="41.0" cy="64" r="7" fill="none" stroke="#3fb950" stroke-width="1.4"/><path d="M37.5,64 l2.5,2.5 l4.5,-5" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="122.0" y="68" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" text-anchor="end" fill="#6e7681">01</text><text x="34.0" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">Parent POM</text><text x="34.0" y="108" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#8d96a0">mvn -N install</text>
