<svg xmlns="http://www.w3.org/2000/svg" width="880" height="206" viewBox="0 0 880 206" role="img" aria-label="GenAI request flow in ai-service: 1 a user asks for laptops under 50,000 rupees; 2 the gateway validates the user&#x27;s JWT; 3 ai-service sends the question with a system prompt through LangChain4j; 4 the LLM picks a tool, findProducts; 5 product-service is called with the caller&#x27;s JWT; 6 the answer is grounded in live data. Status: wiring done, tools in progress.">
