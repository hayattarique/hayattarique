<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-label="Architecture of the e-commerce platform: a client calls the gateway, which validates the JWT and routes to auth-service, user-service, product-service and ai-service. Services share a JWT security starter, each owns its PostgreSQL schema, ai-service calls OpenAI through LangChain4j, and Kafka with an outbox is planned. Platform: Eureka discovery, config server, OpenTelemetry to Jaeger, Jenkins health-gated deploys.">
<title>Architecture of the e-commerce platform: a client calls the gateway, which validates the JWT and routes to auth-service, user-service, product-service and ai-service. Services share a JWT security starter, each owns its PostgreSQL schema, ai-service calls OpenAI through LangChain4j, and Kafka with an outbox is planned. Platform: Eureka discovery, config server, OpenTelemetry to Jaeger, Jenkins health-gated deploys.</title>
