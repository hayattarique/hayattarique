<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" role="img" aria-label="Impact: 11 Spring Boot microservices; ~30% Faster inter-service calls; 50+ REST APIs designed; Zero Downtime deployments; 10+ CI/CD pipelines automated; TDD JUnit 5 · Mockito · JaCoCo">
<title>Impact: 11 Spring Boot microservices; ~30% Faster inter-service calls; 50+ REST APIs designed; Zero Downtime deployments; 10+ CI/CD pipelines automated; TDD JUnit 5 · Mockito · JaCoCo</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07021a"/><stop offset=".55" stop-color="#140640"/><stop offset="1" stop-color="#07021a"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6d28d9"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#6d28d9"/>
  </linearGradient>
  <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c026d3"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c4b5fd"/><stop offset=".45" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".55" stop-color="#c4b5fd"/><stop offset="1" stop-color="#c4b5fd"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4.5s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<style>
  .in   { animation: in .9s cubic-bezier(.16,1,.3,1) both; }
  .up   { animation: up .8s cubic-bezier(.16,1,.3,1) both; }
  .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.6s ease-out infinite; }
  .pulse{ animation: pulse 2s ease-in-out infinite; }
  .comet{ stroke-dasharray: 90 910; animation: comet 7s linear infinite; }
  .blink{ animation: blink 1s step-end infinite; }
  .nudge{ animation: nudge 1.6s ease-in-out infinite; }
  @keyframes in    { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  @keyframes up    { from { opacity: 0; transform: translateY(14px); }  to { opacity: 1; transform: none; } }
  @keyframes ring  { from { transform: scale(1); opacity: .7; } to { transform: scale(1.7); opacity: 0; } }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes comet { to { stroke-dashoffset: -1000; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .num { font: 700 40px 'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif; fill: #c4b5fd; text-anchor: middle; }
  .lab { font: 600 16px 'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif; fill: #f5f3ff; text-anchor: middle; }
  .sub { font: 400 13px 'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif; fill: #b4b0d6; text-anchor: middle; }
  .tsweep { animation: tsweep 4.2s linear infinite; }
  @keyframes tsweep { from { transform: translateX(0); } to { transform: translateX(510px); } }
</style>
<defs>
  <clipPath id="tclip"><rect x="0" y="0" width="270" height="178" rx="10"/></clipPath>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<path d="M15,1 H865 A14,14 0 0 1 879,15 V395 A14,14 0 0 1 865,409 H15 A14,14 0 0 1 1,395 V15 A14,14 0 0 1 15,1 Z" fill="url(#bg)" stroke="#7c3aed" stroke-opacity=".35"/>
<path class="comet" d="M15,1 H865 A14,14 0 0 1 879,15 V395 A14,14 0 0 1 865,409 H15 A14,14 0 0 1 1,395 V15 A14,14 0 0 1 15,1 Z" pathLength="1000" fill="none" stroke="url(#edge)" stroke-width="2.2" stroke-linecap="round"/>
<g transform="translate(20,20)"><g class="up" style="animation-delay:0.00s">
  <path d="M10,0 H260 A10,10 0 0 1 270,10 V168 A10,10 0 0 1 260,178 H10 A10,10 0 0 1 0,168 V10 A10,10 0 0 1 10,0 Z" fill="#ffffff" fill-opacity=".035" stroke="#7c3aed" stroke-opacity=".38"/>
  <g clip-path="url(#tclip)"><rect class="tsweep" style="animation-delay:0.0s" x="-120" y="0" width="120" height="2.5" fill="url(#shine)"/></g>
  <text x="135.0" y="62" class="num" filter="url(#glow)">11</text>
  <text x="135.0" y="92" class="lab">Spring Boot microservices</text>
  <text x="135.0" y="118" class="sub">Independently deployable services</text>
  <text x="135.0" y="136" class="sub">powering a live FinTech platform</text>
</g></g>
<g transform="translate(304,20)"><g class="up" style="animation-delay:0.12s">
  <path d="M10,0 H260 A10,10 0 0 1 270,10 V168 A10,10 0 0 1 260,178 H10 A10,10 0 0 1 0,168 V10 A10,10 0 0 1 10,0 Z" fill="#ffffff" fill-opacity=".035" stroke="#7c3aed" stroke-opacity=".38"/>
  <g clip-path="url(#tclip)"><rect class="tsweep" style="animation-delay:0.6s" x="-120" y="0" width="120" height="2.5" fill="url(#shine)"/></g>
  <text x="135.0" y="62" class="num" filter="url(#glow)">~30%</text>
  <text x="135.0" y="92" class="lab">Faster inter-service calls</text>
  <text x="135.0" y="118" class="sub">Netflix Eureka + Spring Cloud Gateway</text>
  <text x="135.0" y="136" class="sub">replacing hardcoded service routing</text>
</g></g>
<g transform="translate(588,20)"><g class="up" style="animation-delay:0.24s">
  <path d="M10,0 H260 A10,10 0 0 1 270,10 V168 A10,10 0 0 1 260,178 H10 A10,10 0 0 1 0,168 V10 A10,10 0 0 1 10,0 Z" fill="#ffffff" fill-opacity=".035" stroke="#7c3aed" stroke-opacity=".38"/>
  <g clip-path="url(#tclip)"><rect class="tsweep" style="animation-delay:1.2s" x="-120" y="0" width="120" height="2.5" fill="url(#shine)"/></g>
  <text x="135.0" y="62" class="num" filter="url(#glow)">50+</text>
  <text x="135.0" y="92" class="lab">REST APIs designed</text>
  <text x="135.0" y="118" class="sub">Versioned, documented with OpenAPI,</text>
  <text x="135.0" y="136" class="sub">secured with JWT and role-based access</text>
</g></g>
<g transform="translate(20,212)"><g class="up" style="animation-delay:0.36s">
  <path d="M10,0 H260 A10,10 0 0 1 270,10 V168 A10,10 0 0 1 260,178 H10 A10,10 0 0 1 0,168 V10 A10,10 0 0 1 10,0 Z" fill="#ffffff" fill-opacity=".035" stroke="#7c3aed" stroke-opacity=".38"/>
  <g clip-path="url(#tclip)"><rect class="tsweep" style="animation-delay:1.8s" x="-120" y="0" width="120" height="2.5" fill="url(#shine)"/></g>
  <text x="135.0" y="62" class="num" filter="url(#glow)">Zero</text>
  <text x="135.0" y="92" class="lab">Downtime deployments</text>
  <text x="135.0" y="118" class="sub">Rolling releases on AWS after</text>
  <text x="135.0" y="136" class="sub">re-architecting legacy modules —</text>
  <text x="135.0" y="154" class="sub">~30% less release effort</text>
</g></g>
<g transform="translate(304,212)"><g class="up" style="animation-delay:0.48s">
  <path d="M10,0 H260 A10,10 0 0 1 270,10 V168 A10,10 0 0 1 260,178 H10 A10,10 0 0 1 0,168 V10 A10,10 0 0 1 10,0 Z" fill="#ffffff" fill-opacity=".035" stroke="#7c3aed" stroke-opacity=".38"/>
  <g clip-path="url(#tclip)"><rect class="tsweep" style="animation-delay:2.4s" x="-120" y="0" width="120" height="2.5" fill="url(#shine)"/></g>
  <text x="135.0" y="62" class="num" filter="url(#glow)">10+</text>
  <text x="135.0" y="92" class="lab">CI/CD pipelines automated</text>
  <text x="135.0" y="118" class="sub">Build, test, SonarQube quality gate,</text>
  <text x="135.0" y="136" class="sub">image push and deploy — no manual steps</text>
</g></g>
<g transform="translate(588,212)"><g class="up" style="animation-delay:0.60s">
  <path d="M10,0 H260 A10,10 0 0 1 270,10 V168 A10,10 0 0 1 260,178 H10 A10,10 0 0 1 0,168 V10 A10,10 0 0 1 10,0 Z" fill="#ffffff" fill-opacity=".035" stroke="#7c3aed" stroke-opacity=".38"/>
  <g clip-path="url(#tclip)"><rect class="tsweep" style="animation-delay:3.0s" x="-120" y="0" width="120" height="2.5" fill="url(#shine)"/></g>
  <text x="135.0" y="62" class="num" filter="url(#glow)">TDD</text>
  <text x="135.0" y="92" class="lab">JUnit 5 · Mockito · JaCoCo</text>
  <text x="135.0" y="118" class="sub">Coverage gates enforced in CI,</text>
  <text x="135.0" y="136" class="sub">cutting regression risk across services</text>
</g></g>
