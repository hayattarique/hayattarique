<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Let&#x27;s build something that stays up. Email hayattarique3@gmail.com. Open to full-time, remote, and Hyderabad, Kolkata or Delhi roles.">
<title>Let's build something that stays up. Email hayattarique3@gmail.com. Open to full-time, remote, and Hyderabad, Kolkata or Delhi roles.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07021a"/><stop offset=".55" stop-color="#140640"/><stop offset="1" stop-color="#07021a"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6d28d9"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#6d28d9"/>
  </linearGradient>
  <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c026d3"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c4b5fd"/><stop offset=".45" stop-color="#c4b5fd"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".55" stop-color="#c4b5fd"/><stop offset="1" stop-color="#c4b5fd"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4.5s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<style>
  .in   { animation: in .9s cubic-bezier(.16,1,.3,1) both; }
  .up   { animation: up .8s cubic-bezier(.16,1,.3,1) both; }
  .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.6s ease-out infinite; }
  .pulse{ animation: pulse 2s ease-in-out infinite; }
  .comet{ stroke-dasharray: 90 910; animation: comet 7s linear infinite; }
  .blink{ animation: blink 1s step-end infinite; }
  .nudge{ animation: nudge 1.6s ease-in-out infinite; }
  @keyframes in    { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  @keyframes up    { from { opacity: 0; transform: translateY(14px); }  to { opacity: 1; transform: none; } }
  @keyframes ring  { from { transform: scale(1); opacity: .7; } to { transform: scale(1.7); opacity: 0; } }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes comet { to { stroke-dashoffset: -1000; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .bring { transform-box: fill-box; transform-origin: center; animation: bring 2.8s ease-out infinite; }
  @keyframes bring { from { transform: scale(1); opacity: .7; } to { transform: scale(1.1, 1.5); opacity: 0; } }
  .bsweep { animation: bsweep 3.2s ease-in-out infinite; }
  @keyframes bsweep { from { transform: translateX(0); } to { transform: translateX(660px); } }
</style>
<defs><clipPath id="btn"><rect x="260.0" y="124" width="380" height="54" rx="27"/></clipPath></defs>
<path d="M19,1 H881 A18,18 0 0 1 899,19 V231 A18,18 0 0 1 881,249 H19 A18,18 0 0 1 1,231 V19 A18,18 0 0 1 19,1 Z" fill="url(#bg)" stroke="#7c3aed" stroke-opacity=".35"/>
<path class="comet" d="M19,1 H881 A18,18 0 0 1 899,19 V231 A18,18 0 0 1 881,249 H19 A18,18 0 0 1 1,231 V19 A18,18 0 0 1 19,1 Z" pathLength="1000" fill="none" stroke="url(#edge)" stroke-width="2.2" stroke-linecap="round"/>
<text class="up" x="450.0" y="70" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="url(#tg)" text-anchor="middle">Let’s build something that stays up</text>
<text class="up" style="animation-delay:.15s" x="450.0" y="102" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#b4b0d6" text-anchor="middle">Open to Senior Java Backend &amp; Cloud Engineer roles · including GenAI on the JVM</text>
<rect class="bring" x="260.0" y="124" width="380" height="54" rx="27" fill="none" stroke="#a78bfa" stroke-width="2"/>
<rect x="260.0" y="124" width="380" height="54" rx="27" fill="url(#ic)"/>
<g clip-path="url(#btn)"><rect class="bsweep" x="120.0" y="124" width="140" height="54" fill="url(#shine)" opacity=".35"/></g>
<text x="450.0" y="158" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">✉  hayattarique3@gmail.com</text>
<g class="up" style="animation-delay:0.35s"><rect x="233" y="198" width="102" height="28" rx="14" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".5"/><circle class="pulse" style="animation-delay:0.0s" cx="249" cy="212" r="4" fill="#22c55e"/><text x="261" y="216.5" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#bbf7d0">Full-time</text></g>
<g class="up" style="animation-delay:0.45s"><rect x="347" y="198" width="81" height="28" rx="14" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".5"/><circle class="pulse" style="animation-delay:0.3s" cx="363" cy="212" r="4" fill="#22c55e"/><text x="375" y="216.5" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#bbf7d0">Remote</text></g>
<g class="up" style="animation-delay:0.55s"><rect x="441" y="198" width="226" height="28" rx="14" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".5"/><circle class="pulse" style="animation-delay:0.6s" cx="457" cy="212" r="4" fill="#22c55e"/><text x="469" y="216.5" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#bbf7d0">Hyderabad · Kolkata · Delhi</text></g>
</svg>
