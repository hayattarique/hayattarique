<!-- ============ LAYER 4 · EVENT BACKBONE ============ -->
<g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect x="60" y="474" width="1081" height="56" rx="10" fill="url(#kafkaFill)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.85"/>
  <text x="90" y="498" font-size="15.5" font-weight="700" fill="#ffd9a0">Apache Kafka &#8212; Event Backbone</text>
  <text x="90" y="518" font-size="12.5" fill="#c2a172">Partitioned topics &#183; Consumer groups &#183; Saga choreography &#183; At-least-once delivery &#183; DLQ replay</text>
  <text x="1115" y="508" text-anchor="end" font-size="11.5" letter-spacing="1.4" fill="#f59e0b">EVENTUAL CONSISTENCY</text>

  <!-- travelling event pulses along the bus -->
  <circle cy="502" r="3.4" fill="#fbbf24" filter="url(#soft)">
    <animate attributeName="cx" values="80;1120" dur="4.2s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cy="502" r="2.6" fill="#fde68a" filter="url(#soft)">
    <animate attributeName="cx" values="80;1120" dur="4.2s" begin="1.4s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cy="502" r="2.6" fill="#fbbf24" filter="url(#soft)">
    <animate attributeName="cx" values="80;1120" dur="4.2s" begin="2.8s" repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.2s" begin="2.8s" repeatCount="indefinite"/>
  </circle>
</g>

