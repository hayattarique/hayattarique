<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Cloud-native microservices reference architecture: clients, Spring Cloud Gateway, Eureka discovery, Config Server, six domain services, Kafka event backbone, polyglot persistence, and the platform and observability layer.">
<title>Cloud-Native Microservices Architecture — Tarique Hayat</title>

<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#050015"/>
    <stop offset="35%"  stop-color="#0d0036"/>
    <stop offset="72%"  stop-color="#14004a"/>
    <stop offset="100%" stop-color="#050015"/>
  </linearGradient>

  <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#6d28d9"/>
    <stop offset="50%"  stop-color="#a855f7"/>
    <stop offset="100%" stop-color="#6d28d9"/>
  </linearGradient>

  <linearGradient id="kafkaFill" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#2a1206"/>
    <stop offset="50%"  stop-color="#3d1d08"/>
    <stop offset="100%" stop-color="#2a1206"/>
  </linearGradient>

  <linearGradient id="platFill" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#0a1f33"/>
    <stop offset="50%"  stop-color="#0d2b45"/>
    <stop offset="100%" stop-color="#0a1f33"/>
  </linearGradient>

  <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
  </radialGradient>

  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.4"/>
  </filter>

  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#7c3aed"/>
  </marker>
  <marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" fill="#f59e0b"/>
  </marker>
</defs>

<!-- ============ CANVAS ============ -->
<rect width="1200" height="760" fill="url(#bg)"/>
<ellipse cx="250" cy="180" rx="420" ry="300" fill="url(#orb1)"/>
<ellipse cx="960" cy="560" rx="400" ry="280" fill="url(#orb2)"/>
<rect x="0" y="0" width="1200" height="4" fill="url(#topBar)"/>

<!-- ============ TITLE ============ -->
<text x="60" y="48" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="0.4" fill="#f0e6ff">Cloud-Native Microservices Architecture</text>
<text x="1140" y="48" text-anchor="end" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="1.6" fill="#a855f7">JAVA 17 &#183; SPRING BOOT 3 &#183; AWS</text>
<line x1="60" y1="62" x2="1140" y2="62" stroke="#3b1d6e" stroke-width="1"/>

<!-- ============ LAYER 1 · CLIENTS ============ -->
<text x="60" y="92" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#7b8bb0">EDGE CLIENTS</text>

<g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect x="210" y="102" width="240" height="52" rx="10" fill="#150038" fill-opacity="0.9" stroke="#4c2a8a" stroke-width="1.2"/>
  <text x="330" y="134" text-anchor="middle" font-size="15" font-weight="600" fill="#dcd0ff">Web &#183; Angular SPA</text>

  <rect x="480" y="102" width="240" height="52" rx="10" fill="#150038" fill-opacity="0.9" stroke="#4c2a8a" stroke-width="1.2"/>
  <text x="600" y="134" text-anchor="middle" font-size="15" font-weight="600" fill="#dcd0ff">Mobile Clients</text>

  <rect x="750" y="102" width="240" height="52" rx="10" fill="#150038" fill-opacity="0.9" stroke="#4c2a8a" stroke-width="1.2"/>
  <text x="870" y="134" text-anchor="middle" font-size="15" font-weight="600" fill="#dcd0ff">Third-Party / Partner APIs</text>
</g>

<!-- client -> gateway -->
<path d="M330,154 L330,178 L600,178 L600,196" fill="none" stroke="#7c3aed" stroke-width="1.4" opacity="0.65"/>
<path d="M870,154 L870,178 L600,178 L600,196" fill="none" stroke="#7c3aed" stroke-width="1.4" opacity="0.65"/>
<path id="flowIn" d="M600,154 L600,196" fill="none" stroke="#7c3aed" stroke-width="1.4" opacity="0.65" marker-end="url(#ar)"/>
<circle r="3.2" fill="#c4b5fd" filter="url(#soft)">
  <animateMotion dur="2.6s" repeatCount="indefinite" path="M600,154 L600,196"/>
  <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite"/>
</circle>

<!-- ============ LAYER 2 · EDGE / CONTROL PLANE ============ -->
<text x="60" y="216" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#7b8bb0">CONTROL PLANE</text>

<g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <!-- Eureka -->
  <rect x="60" y="226" width="250" height="66" rx="10" fill="#1a0033" fill-opacity="0.92" stroke="#E50914" stroke-width="1.3" stroke-opacity="0.75"/>
  <rect x="60" y="226" width="4" height="66" rx="2" fill="#E50914"/>
  <text x="185" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#ffd9db">Netflix Eureka</text>
  <text x="185" y="274" text-anchor="middle" font-size="12.5" fill="#9aa4c0">Service Discovery Registry</text>

  <!-- API Gateway -->
  <rect x="370" y="220" width="460" height="78" rx="12" fill="#0e2b12" fill-opacity="0.92" stroke="#6DB33F" stroke-width="1.6"/>
  <rect x="370" y="220" width="4" height="78" rx="2" fill="#6DB33F"/>
  <text x="600" y="250" text-anchor="middle" font-size="17" font-weight="700" fill="#d6f5c4">Spring Cloud Gateway</text>
  <text x="600" y="273" text-anchor="middle" font-size="12.5" fill="#9fb894">Routing &#183; JWT Filter Chain &#183; Rate Limiting &#183; Client-Side Load Balancing</text>
  <text x="600" y="290" text-anchor="middle" font-size="11.5" letter-spacing="1.2" fill="#6DB33F">RESILIENCE4J CIRCUIT BREAKER &#183; RETRY &#183; BULKHEAD</text>

  <!-- Config Server -->
  <rect x="890" y="226" width="250" height="66" rx="10" fill="#1a0033" fill-opacity="0.92" stroke="#FF9900" stroke-width="1.3" stroke-opacity="0.75"/>
  <rect x="890" y="226" width="4" height="66" rx="2" fill="#FF9900"/>
  <text x="1015" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#ffe6bf">Config Server</text>
  <text x="1015" y="274" text-anchor="middle" font-size="12.5" fill="#9aa4c0">AWS Secrets Manager</text>
</g>

<!-- eureka/config <-> gateway -->
<path d="M310,259 L370,259" fill="none" stroke="#E50914" stroke-width="1.2" opacity="0.5" stroke-dasharray="4 4"/>
<path d="M830,259 L890,259" fill="none" stroke="#FF9900" stroke-width="1.2" opacity="0.5" stroke-dasharray="4 4"/>

<!-- gateway -> services fan-out -->
<path d="M600,298 L600,322" fill="none" stroke="#7c3aed" stroke-width="1.4" opacity="0.7"/>
<path d="M143,322 L1057,322" fill="none" stroke="#7c3aed" stroke-width="1.4" opacity="0.45"/>
<g stroke="#7c3aed" stroke-width="1.4" opacity="0.6" fill="none" marker-end="url(#ar)">
