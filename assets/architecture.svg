<!-- ============ LAYER 3 · DOMAIN SERVICES ============ -->
<text x="60" y="348" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#7b8bb0">DOMAIN SERVICES &#8212; INDEPENDENTLY DEPLOYABLE</text>

<g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <g>
    <rect x="60" y="356" width="166" height="72" rx="10" fill="#160a3d" fill-opacity="0.95" stroke="#6DB33F" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="143" y="384" text-anchor="middle" font-size="14.5" font-weight="700" fill="#e2d9ff">Auth</text>
