<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="14" viewBox="0 0 1200 14" role="img" aria-label="">
<defs>
  <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
    <stop offset="20%" stop-color="#6d28d9"/>
    <stop offset="50%" stop-color="#a855f7"/>
    <stop offset="80%" stop-color="#6d28d9"/>
    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#f5f3ff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#f5f3ff" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#f5f3ff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clip"><rect x="0" y="5" width="1200" height="4" rx="2"/></clipPath>
</defs>
<rect x="0" y="5" width="1200" height="4" rx="2" fill="url(#line)"/>
<g clip-path="url(#clip)">
  <rect x="-240" y="5" width="240" height="4" fill="url(#shine)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 1680,0" dur="4s" repeatCount="indefinite"/>
  </rect>
</g>
<circle cx="600" cy="7" r="4" fill="#c4b5fd">
  <animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/>
</circle>
</svg>
